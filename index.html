<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Crossroads Engine</title>
        <link rel="stylesheet" href="/src/ui/style.css">
    </head>
    <body>
        <div id="page">
            <main id="game">
                <button id="map-button" type="button">Map</button>
                <div id="story"></div>
                <div id="options"></div>
                <div id="status"></div>
            </main>
            <!-- After the scene, so a screen reader reads the current scene first. It's moved above the scene on screen by its style. -->
            <div id="history" role="log" aria-live="off" aria-label="Earlier scenes" hidden>
                <div id="history-entries"></div>
                <div id="history-gap" aria-hidden="true"></div>
            </div>
            <div id="history-hint" aria-hidden="true" hidden>earlier</div>
            <button id="history-now" type="button" hidden>back to now</button>
        </div>
        <div id="map-screen" class="map-screen" role="dialog" aria-modal="true" aria-label="Map" tabindex="-1" hidden></div>
        <script type="module" src="/src/ui/main.ts"></script>
    </body>
</html>
