<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Crossroads Engine</title>
        <link rel="stylesheet" href="/src/ui/style.css">
    </head>
    <body>
        <div id="page">
            <main id="game">
                <div id="corner-buttons">
                    <button id="history-button" type="button" hidden>History</button>
                    <button id="map-button" type="button">Map</button>
                    <button id="menu-button" type="button">Menu</button>
                </div>
                <div id="story"></div>
                <div id="options"></div>
                <div id="status"></div>
            </main>
        </div>
        <div id="history-screen" class="history-screen" role="dialog" aria-modal="true" aria-label="History" tabindex="-1" hidden></div>
        <div id="page-screen" class="panel-screen" role="dialog" aria-modal="true" tabindex="-1" hidden></div>
        <div id="menu-screen" class="panel-screen" role="dialog" aria-modal="true" tabindex="-1" hidden></div>
        <div id="map-screen" class="map-screen" role="dialog" aria-modal="true" aria-label="Map" tabindex="-1" hidden></div>
        <script type="module" src="/src/ui/main.ts"></script>
    </body>
</html>
